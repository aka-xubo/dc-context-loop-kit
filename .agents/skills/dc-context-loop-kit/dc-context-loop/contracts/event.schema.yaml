$schema: https://json-schema.org/draft/2020-12/schema
$id: dc-context-loop/event.schema.yaml
title: Deep Crew Context Loop Event
type: object
additionalProperties: false
required: [document_type, event]
properties:
  document_type:
    const: deep_crew_delivery_event
  event:
    type: object
    additionalProperties: false
    required: [event_id, created_at, author, node, reason]
    properties:
      event_id: {type: string, pattern: '^EVT-[A-Za-z0-9_-]+$'}
      created_at: {type: string, minLength: 1}
      author: {type: string, minLength: 1}
      node: {enum: [REQ, SPEC, IMPLEMENTATION, ACCEPTANCE]}
      reason: {type: string, minLength: 1}
      requirement: {$ref: '#/$defs/requirement_snapshot'}
      specification: {$ref: '#/$defs/specification_snapshot'}
      subject_id: {type: string, pattern: '^(IMP|ACC)-[A-Za-z0-9_-]+$'}
      implementation: {$ref: '#/$defs/implementation_result'}
      acceptance: {$ref: '#/$defs/acceptance_result'}
      impact: {$ref: '#/$defs/impact'}
      references:
        type: object
        additionalProperties: false
        properties:
          issue: {type: string, minLength: 1}
    allOf:
      - if:
          properties: {node: {const: REQ}}
        then:
          required: [requirement]
          not:
            anyOf:
              - required: [subject_id]
              - required: [specification]
              - required: [implementation]
              - required: [acceptance]
              - required: [impact]
      - if:
          properties: {node: {const: SPEC}}
        then:
          required: [specification]
          not:
            anyOf:
              - required: [subject_id]
              - required: [requirement]
              - required: [implementation]
              - required: [acceptance]
              - required: [impact]
      - if:
          properties: {node: {const: IMPLEMENTATION}}
        then:
          required: [subject_id, implementation, impact]
          not:
            anyOf:
              - required: [requirement]
              - required: [specification]
              - required: [acceptance]
          properties:
            subject_id: {type: string, pattern: '^IMP-[A-Za-z0-9_-]+$'}
      - if:
          properties: {node: {const: ACCEPTANCE}}
        then:
          required: [subject_id, acceptance, impact]
          not:
            anyOf:
              - required: [requirement]
              - required: [specification]
              - required: [implementation]
          properties:
            subject_id: {type: string, pattern: '^ACC-[A-Za-z0-9_-]+$'}
$defs:
  requirement_snapshot:
    type: object
    additionalProperties: false
    required: [id, title, statement, business_outcomes, scope, constraints, open_questions]
    properties:
      id: {type: string, pattern: '^REQ-[A-Za-z0-9_-]+$'}
      title: {type: string, minLength: 1}
      statement: {type: string, minLength: 1}
      business_outcomes:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      scope:
        type: object
        additionalProperties: false
        required: [included, excluded]
        properties:
          included: {type: array, items: {type: string, minLength: 1}}
          excluded: {type: array, items: {type: string, minLength: 1}}
      constraints: {type: array, items: {type: string, minLength: 1}}
      open_questions: {type: array, items: {type: string, minLength: 1}}
  specification_snapshot:
    oneOf:
      - {$ref: '#/$defs/specification_full_snapshot'}
      - {$ref: '#/$defs/specification_delta'}
  specification_full_snapshot:
    type: object
    additionalProperties: false
    required: [requirement_ref, scenarios, checks, assertions, open_questions]
    properties:
      requirement_ref: {type: string, pattern: '^REQ-[A-Za-z0-9_-]+$'}
      scenarios:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/scenario'}
      checks:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/check'}
      assertions:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/assertion'}
      open_questions: {type: array, items: {type: string, minLength: 1}}
  specification_delta:
    type: object
    additionalProperties: false
    required: [requirement_ref, base_spec_ref, changes, open_questions]
    properties:
      requirement_ref: {type: string, pattern: '^REQ-[A-Za-z0-9_-]+$'}
      base_spec_ref: {type: string, pattern: '^SPEC-[A-Za-z0-9_-]+$'}
      changes:
        type: object
        additionalProperties: false
        required: [added, modified, removed]
        properties:
          added: {$ref: '#/$defs/specification_changeset'}
          modified: {$ref: '#/$defs/specification_changeset'}
          removed:
            type: object
            additionalProperties: false
            required: [scenarios, checks, assertions]
            properties:
              scenarios: {type: array, items: {type: string, pattern: '^SCN-[A-Za-z0-9_-]+$'}}
              checks: {type: array, items: {type: string, pattern: '^CHK-[A-Za-z0-9_-]+$'}}
              assertions: {type: array, items: {type: string, pattern: '^AST-[A-Za-z0-9_-]+$'}}
      open_questions: {type: array, items: {type: string, minLength: 1}}
  specification_changeset:
    type: object
    additionalProperties: false
    required: [scenarios, checks, assertions]
    properties:
      scenarios: {type: array, items: {$ref: '#/$defs/scenario'}}
      checks: {type: array, items: {$ref: '#/$defs/check'}}
      assertions: {type: array, items: {$ref: '#/$defs/assertion'}}
  scenario:
    type: object
    additionalProperties: false
    required: [id, title, business_result, given, when, then, delivery_surfaces]
    properties:
      id: {type: string, pattern: '^SCN-[A-Za-z0-9_-]+$'}
      title: {type: string, minLength: 1}
      business_result: {type: string, minLength: 1}
      given: {type: array, items: {type: string, minLength: 1}}
      when: {type: string, minLength: 1}
      then:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [id, statement]
          properties:
            id: {type: string, pattern: '^THEN-[A-Za-z0-9_-]+$'}
            statement: {type: string, minLength: 1}
      delivery_surfaces: {type: array, items: {type: string, minLength: 1}}
  check:
    type: object
    additionalProperties: false
    required: [id, scenario_ids, verification_type, responsibility, required, blocking]
    properties:
      id: {type: string, pattern: '^CHK-[A-Za-z0-9_-]+$'}
      scenario_ids:
        type: array
        minItems: 1
        items: {type: string, pattern: '^SCN-[A-Za-z0-9_-]+$'}
      verification_type: {enum: [unit, api, ui, e2e]}
      responsibility: {type: string, minLength: 1}
      required: {type: boolean}
      blocking: {type: boolean}
      dependency_ids: {type: array, items: {type: string, pattern: '^DEP-[A-Za-z0-9_-]+$'}}
      evidence_requirements:
        type: object
        additionalProperties: false
        properties:
          required_artifact_types:
            type: array
            items: {enum: [command_output, api_exchange, state_observation, screenshot]}
      external_verification:
        oneOf:
          - {type: 'null'}
          - type: object
            additionalProperties: true
            required: [provider, mode]
            properties:
              provider: {type: string, minLength: 1}
              mode: {enum: [stub, contract, real_test_app]}
  assertion:
    type: object
    additionalProperties: false
    required: [id, check_id, outcome_refs, assertion_type, description]
    properties:
      id: {type: string, pattern: '^AST-[A-Za-z0-9_-]+$'}
      check_id: {type: string, pattern: '^CHK-[A-Za-z0-9_-]+$'}
      outcome_refs:
        type: array
        minItems: 1
        items: {type: string, pattern: '^SCN-[A-Za-z0-9_-]+\.THEN-[A-Za-z0-9_-]+$'}
      assertion_type: {enum: [semantic, predicate]}
      description: {type: string, minLength: 1}
      ontology_refs: {type: array, items: {type: string, minLength: 1}}
      predicate: {type: object, additionalProperties: true}
  impact:
    type: object
    additionalProperties: false
    required: [affected_ids, next_actions]
    properties:
      affected_ids: {type: array, items: {type: string, minLength: 1}}
      next_actions:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [action, owner]
          properties:
            action: {type: string, minLength: 1}
            owner: {type: string, minLength: 1}
  implementation_result:
    type: object
    additionalProperties: false
    required: [status, requirement_ref, spec_refs, summary, completed_items, change_surface, development_checks, known_limits, git_commit]
    properties:
      status: {const: READY}
      requirement_ref: {type: string, pattern: '^REQ-[A-Za-z0-9_-]+$'}
      spec_refs: {type: array, items: {type: string, pattern: '^(SCN|CHK|AST)-[A-Za-z0-9_-]+$'}}
      summary: {type: string, minLength: 1}
      completed_items:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [id, title, kind, objective, check_refs, assertion_refs]
          properties:
            id: {type: string, pattern: '^SLICE-[A-Za-z0-9_-]+$'}
            title: {type: string, minLength: 1}
            kind: {enum: [behavior_slice, engineering_slice, readiness_slice]}
            objective: {type: string, minLength: 1}
            check_refs: {type: array, items: {type: string, pattern: '^CHK-[A-Za-z0-9_-]+$'}}
            assertion_refs: {type: array, items: {type: string, pattern: '^AST-[A-Za-z0-9_-]+$'}}
      change_surface:
        type: object
        additionalProperties: false
        required: [production_files, test_files, scripts, new_interfaces, changed_interfaces, database_changes, configuration_changes, dependency_changes, external_contract_changes]
        properties:
          production_files: {type: array, items: {type: string, minLength: 1}}
          test_files: {type: array, items: {type: string, minLength: 1}}
          scripts: {type: array, items: {type: string, minLength: 1}}
          new_interfaces: {type: array, items: {type: string, minLength: 1}}
          changed_interfaces: {type: array, items: {type: string, minLength: 1}}
          database_changes: {type: array, items: {type: string, minLength: 1}}
          configuration_changes: {type: array, items: {type: string, minLength: 1}}
          dependency_changes: {type: array, items: {type: string, minLength: 1}}
          external_contract_changes: {type: array, items: {type: string, minLength: 1}}
      development_checks:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [command, status, summary]
          properties:
            command: {type: string, minLength: 1}
            status: {enum: [PASSED, SKIPPED]}
            summary: {type: string, minLength: 1}
      known_limits: {type: array, items: {type: string, minLength: 1}}
      git_commit: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
  acceptance_result:
    type: object
    additionalProperties: false
    required: [status, requirement_ref, spec_refs, implementation_refs, git_commit, runs, artifacts, assertion_results, reason]
    properties:
      status: {enum: [SATISFIED, NOT_SATISFIED, BLOCKED, INCOMPLETE]}
      requirement_ref: {type: string, pattern: '^REQ-[A-Za-z0-9_-]+$'}
      spec_refs: {type: array, items: {type: string, pattern: '^(SCN|CHK|AST)-[A-Za-z0-9_-]+$'}}
      implementation_refs: {type: array, items: {type: string, pattern: '^IMP-[A-Za-z0-9_-]+$'}}
      git_commit: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
      runs:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, phase, check_refs, assertion_refs, status]
          properties:
            id: {type: string, pattern: '^RUN-[A-Za-z0-9_-]+$'}
            phase: {type: string, minLength: 1}
            check_refs: {type: array, items: {type: string, pattern: '^CHK-[A-Za-z0-9_-]+$'}}
            assertion_refs: {type: array, items: {type: string, pattern: '^AST-[A-Za-z0-9_-]+$'}}
            status: {enum: [PASSED, FAILED, BLOCKED]}
      artifacts:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, type, location]
          properties:
            id: {type: string, pattern: '^ART-[A-Za-z0-9_-]+$'}
            type: {enum: [command_output, api_exchange, state_observation, screenshot]}
            location: {type: string, minLength: 1}
      assertion_results:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [assertion_id, expected, observed, status, artifact_refs]
          properties:
            assertion_id: {type: string, pattern: '^AST-[A-Za-z0-9_-]+$'}
            expected: {type: string, minLength: 1}
            observed: {type: string, minLength: 1}
            status: {enum: [PASSED, FAILED, BLOCKED]}
            artifact_refs: {type: array, items: {type: string, pattern: '^ART-[A-Za-z0-9_-]+$'}}
      reason: {type: string, minLength: 1}
