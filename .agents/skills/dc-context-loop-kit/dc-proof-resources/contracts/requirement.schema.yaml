$schema: https://json-schema.org/draft/2020-12/schema
$id: delivery-proof/requirement.schema.yaml
title: Delivery Proof Requirement
type: object
additionalProperties: false
required: [document_type, requirement]
properties:
  document_type: {const: requirement}
  requirement:
    type: object
    additionalProperties: false
    required: [id, status, issue_no, title, statement, scope, dependencies, source_refs, confirmation]
    oneOf:
      - required: [business_value]
        not:
          anyOf:
            - required: [business_outcomes]
            - required: [constraints]
            - required: [open_questions]
            - required: [release_notes]
      - required: [business_outcomes, constraints, open_questions, release_notes]
        not:
          required: [business_value]
    properties:
      id: {type: string, pattern: '^REQ-[A-Za-z0-9_-]+$'}
      status: {enum: [DRAFT, CONFIRMED, SATISFIED]}
      issue_no: {type: string, pattern: '^[A-Z][A-Z0-9]*-[1-9][0-9]*$'}
      title: {type: string, minLength: 1}
      statement: {type: string, minLength: 1}
      business_value: {type: string, minLength: 1}
      business_outcomes:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      scope: {type: object, required: [included, excluded], additionalProperties: true}
      constraints:
        type: array
        items: {type: string, minLength: 1}
      dependencies:
        type: array
        items:
          type: object
          required: [id, description, related_requirement_id]
          additionalProperties: false
          properties:
            id: {type: string, pattern: '^DEP-[A-Za-z0-9_-]+$'}
            description: {type: string, minLength: 1}
            related_requirement_id:
              oneOf:
                - {type: 'null'}
                - {type: string, pattern: '^REQ-[A-Za-z0-9_-]+$'}
      source_refs: {type: array}
      open_questions:
        type: array
        items: {type: string, minLength: 1}
      release_notes: {type: string, minLength: 1}
      confirmation:
        oneOf:
          - {type: 'null'}
          - type: object
            required: [confirmed_by, confirmed_at, content_digest]
            additionalProperties: true
