$schema: https://json-schema.org/draft/2020-12/schema
$id: delivery-proof/acceptance-report.schema.yaml
title: Delivery Proof Acceptance Report
type: object
additionalProperties: false
required: [document_type, acceptance_report]
properties:
  document_type: {const: acceptance_report}
  acceptance_report:
    type: object
    additionalProperties: true
    required: [requirement_ref, status, git_commit, repository, definition_digests, mode, scope_refs, req_completion_impact, scenario_results]
    properties:
      requirement_ref: {type: object, required: [requirement_id]}
      status: {enum: [SATISFIED, NOT_SATISFIED]}
      mode: {enum: [targeted, full]}
      scope_refs:
        type: object
        additionalProperties: false
        required: [scenarios, checks, assertions]
        properties:
          scenarios: {type: array, minItems: 1, items: {type: string, pattern: '^SCN-[A-Za-z0-9_-]+$'}}
          checks: {type: array, minItems: 1, items: {type: string, pattern: '^CHK-[A-Za-z0-9_-]+$'}}
          assertions: {type: array, minItems: 1, items: {type: string, pattern: '^AST-[A-Za-z0-9_-]+$'}}
      req_completion_impact: {enum: [NONE, ELIGIBLE]}
      repository:
        type: object
        additionalProperties: false
        required: [worktree_root, git_toplevel]
        properties:
          worktree_root: {type: string, minLength: 1}
          git_toplevel: {type: string, minLength: 1}
      git_commit:
        oneOf:
          - {type: 'null'}
          - {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'}
      definition_digests:
        type: object
        required: [requirement, scenarios, matrix]
      scenario_results:
        type: array
        items:
          type: object
          additionalProperties: true
          required: [scenario_ref, status, reason, run_refs]
          properties:
            scenario_ref: {type: string, pattern: '^SCN-[A-Z0-9-]+$'}
            status: {const: PASS}
            reason: {type: string, minLength: 1}
            run_refs:
              type: array
              minItems: 1
              items: {type: string, pattern: '^RUN-[0-9]+$'}
