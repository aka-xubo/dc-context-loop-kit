$schema: https://json-schema.org/draft/2020-12/schema
$id: delivery-proof/acceptance-scenario.schema.yaml
title: Delivery Proof Acceptance Scenarios
type: object
additionalProperties: false
required: [document_type, requirement_ref, acceptance_scenarios]
properties:
  document_type: {const: acceptance_scenarios}
  requirement_ref:
    type: object
    required: [requirement_id]
    additionalProperties: false
    properties:
      requirement_id: {type: string, pattern: '^REQ-[A-Za-z0-9_-]+$'}
  acceptance_scenarios:
    type: object
    additionalProperties: false
    required: [status, scenarios, open_questions, confirmation]
    properties:
      status: {enum: [DRAFT, CONFIRMED]}
      scenarios:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, title, business_result]
          anyOf:
            - required: [given, when, then]
            - required: [action, expected_outcomes]
          additionalProperties: false
          properties:
            id: {type: string, pattern: '^SCN-[A-Za-z0-9_-]+$'}
            title: {type: string, minLength: 1}
            business_result: {type: string, minLength: 1}
            given: {type: array, items: {type: string, minLength: 1}}
            when: {type: string, minLength: 1}
            then:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [id, statement]
                properties:
                  id: {type: string, pattern: '^THEN-[A-Za-z0-9_-]+$'}
                  statement: {type: string, minLength: 1}
            participants: {type: array}
            preconditions: {type: array}
            action: {type: string, minLength: 1}
            expected_outcomes: {type: array, minItems: 1}
            protected_invariants: {type: array}
            delivery_surfaces: {type: array}
            ontology_refs: {type: array}
            source_refs: {type: array}
      confirmation: {oneOf: [{type: 'null'}, {type: object, additionalProperties: true}]}
      open_questions: {type: array, items: {type: string, minLength: 1}}
